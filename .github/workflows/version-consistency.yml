name: Version Consistency

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check version consistency
        run: node scripts/check-version-consistency.js

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Unlike stamp consistency, this also checks release-please PRs/commits.
      - name: Enforce 0.x manifest policy
        run: node scripts/check-release-policy.js --manifest
      - name: Test release policy entrypoints
        run: node scripts/test/check-release-policy.test.js
      - name: Test fail-closed redistribution guard
        run: node scripts/test/check-redistribution.test.js
      - name: Test authoritative version stamps
        run: node scripts/test/check-version-consistency.test.js
