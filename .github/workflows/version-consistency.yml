name: Version Consistency

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked repository tooling
        run: dotnet restore tools/MssqlMcp.RepoTool --locked-mode
      - name: Check version consistency
        run: dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- check-version-consistency

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked repository checks and regressions
        run: dotnet restore tests/MssqlMcp.RepoTool.Tests --locked-mode
      # Unlike stamp consistency, this also checks release-please PRs/commits.
      - name: Enforce 0.x manifest policy
        run: dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- check-release-policy --manifest
      - name: Test repository policy and stamp behavior
        run: dotnet test --project tests/MssqlMcp.RepoTool.Tests --no-restore
