name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore mssql-mcp.sln --locked-mode
      - run: dotnet build mssql-mcp.sln --no-restore
      - run: dotnet format mssql-mcp.sln --verify-no-changes --no-restore
      - run: dotnet test --solution mssql-mcp.sln --no-build -- --filter-not-trait Category=Integration
      - name: Lint README JSON snippets
        run: dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- lint-readme-snippets
      - name: Pack
        run: dotnet pack src/mssql-mcp/mssql-mcp.csproj -c Release --no-restore -o artifacts
      - name: Generate SBOM
        run: |
          dotnet tool restore
          dotnet dotnet-CycloneDX mssql-mcp.sln --output-format json --output artifacts/sbom
      - name: Assess package redistribution
        id: redistribution
        run: |
          if dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- check-redistribution; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/sbom/*.json
      - name: Upload distributable package
        if: steps.redistribution.outputs.allowed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/*.nupkg

  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      INTEGRATION: 'true'
      MSSQL_CONNECTION_STRING: "Server=localhost;Database=MssqlMcpSecurityTests;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore and build the actual stdio server
        run: |
          dotnet restore mssql-mcp.sln --locked-mode
          dotnet build mssql-mcp.sln --no-restore
      - name: Install content-locked npm and Inspector tools
        run: npm ci --prefix .config/npm-tools --ignore-scripts --no-audit --no-fund --bin-links=false --engine-strict --userconfig=/dev/null
      - name: Initialize the isolated live-test database
        env:
          SQL_CONTAINER: ${{ job.services.sql.id }}
        run: docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -b -Q 'CREATE DATABASE [MssqlMcpSecurityTests];'
      - name: Run live SQL and Guard tests with production branch coverage
        run: |
          dotnet test --project tests/mssql-mcp.Core.Tests/mssql-mcp.Core.Tests.csproj --configuration Release --no-restore --coverlet --results-directory "$PWD/artifacts/coverage/raw/core"
          dotnet test --project tests/mssql-mcp.Tools.Tests/mssql-mcp.Tools.Tests.csproj --configuration Release --no-restore --coverlet --results-directory "$PWD/artifacts/coverage/raw/tools"
      - name: Run npm security regressions with native branch coverage
        run: |
          node .config/npm-tools/node_modules/c8/bin/c8.js --config .config/coverage.npm.json node npm/test.js
          node .config/npm-tools/node_modules/c8/bin/c8.js --config .config/coverage.npm.json --clean=false node npm/poc-tests.js
      - name: Exercise MCP Inspector stdio handshake and tools
        run: dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- mcp-smoke
      - name: Publish production line and branch coverage summary
        if: always()
        run: |
          dotnet tool restore
          dotnet reportgenerator '-reports:artifacts/coverage/raw/**/*.xml' '-targetdir:artifacts/coverage/report' '-reporttypes:Html;Cobertura;JsonSummary' '-sourcedirs:.'
          dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- coverage-summary artifacts/coverage/report/Summary.json artifacts/coverage/npm/coverage-summary.json
      - name: Preserve branch coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-branch-coverage
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 30

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked self-contained dependencies (linux-x64)
        run: dotnet restore src/mssql-mcp/mssql-mcp.csproj -r linux-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishTrimmed=true --lock-file-path packages.linux-x64.lock.json --locked-mode
      - name: Build self-contained binary (linux-x64)
        run: dotnet publish src/mssql-mcp -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --no-restore -o smoke

      - name: Verify --version exits 0
        run: ./smoke/mssql-mcp --version

      - name: Verify --help exits 0 and prints usage
        run: |
          output=$(./smoke/mssql-mcp --help)
          echo "$output" | grep -q "Usage: mssql-mcp"
          echo "$output" | grep -q "To update"
          echo "$output" | grep -q "npm install"

      - name: Verify -h short flag exits 0
        run: |
          ./smoke/mssql-mcp -h | grep -q "Usage: mssql-mcp"

      - name: Verify unknown argument exits 1 with error to stderr
        run: |
          set +e
          output=$(./smoke/mssql-mcp upgrade 2>&1 1>/dev/null)
          exit_code=$?
          set -e
          echo "$output" | grep -q "unknown argument 'upgrade'"
          echo "$output" | grep -q "Usage: mssql-mcp"
          [ "$exit_code" -eq 1 ] || { echo "Expected exit 1, got $exit_code"; exit 1; }

      - name: Start Azure SQL Edge
        run: |
          docker run -d \
            -e "ACCEPT_EULA=1" \
            -e "MSSQL_SA_PASSWORD=YourStrong!Passw0rd" \
            -p 1433:1433 --name mssql-edge \
            mcr.microsoft.com/azure-sql-edge:latest@sha256:902628a8be89e35dfb7895ca31d602974c7bafde4d583a0d0873844feb1c42cf

      - name: Wait for SQL Server to be ready
        run: |
          for i in $(seq 1 60); do
            if docker exec mssql-edge bash -c 'echo > /dev/tcp/localhost/1433' 2>/dev/null; then
              echo "SQL Server port is open"
              # Give it a moment to finish recovery
              sleep 3
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/60)"
            sleep 2
          done
          echo "SQL Server did not start in time"
          docker logs mssql-edge
          exit 1

      - name: Verify --validate exits 0
        run: ./smoke/mssql-mcp --validate
        env:
          MSSQL_CONNECTION_STRING: "Server=localhost;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

  npm-pack:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Postinstall-independent install test (ADR-0028):
      # Build a real linux-x64 binary, stage it into the per-platform package,
      # npm pack the main + per-platform packages, then npm install
      # --ignore-scripts in a temp dir. The shim must resolve the optional dep
      # and exec the binary. This proves the install works without postinstall.
      - name: Restore locked self-contained dependencies (linux-x64)
        run: dotnet restore src/mssql-mcp/mssql-mcp.csproj -r linux-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishTrimmed=true --lock-file-path packages.linux-x64.lock.json --locked-mode
      - name: Build self-contained binary (linux-x64)
        run: dotnet publish src/mssql-mcp -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --no-restore -o smoke

      - name: Stage binary into per-platform package
        run: cp smoke/mssql-mcp npm/platforms/linux-x64/mssql-mcp && chmod 755 npm/platforms/linux-x64/mssql-mcp

      - name: Run shim smoke tests
        run: node npm/test.js

      - name: npm pack main + per-platform packages
        run: |
          (cd npm/platforms/linux-x64 && npm pack)
          (cd npm && npm pack)

      - name: Verify --ignore-scripts install resolves optional dep and runs --version
        run: | # zizmor: ignore[adhoc-packages] -- Offline consumer-install proof uses only this commit's locally built tarballs.
          mkdir -p /tmp/install-test
          cp npm/platforms/linux-x64/*.tgz /tmp/install-test/
          cp npm/*.tgz /tmp/install-test/
          cd /tmp/install-test
          npm install --offline --ignore-scripts ./*.tgz
          ./node_modules/.bin/mssql-mcp --version

      - name: Verify --no-optional + MSSQL_MCP_NO_DOWNLOAD=1 prints actionable error
        run: | # zizmor: ignore[adhoc-packages] -- Offline consumer-install proof uses only this commit's locally built tarball.
          mkdir -p /tmp/no-optional-test
          cp npm/*.tgz /tmp/no-optional-test/
          cd /tmp/no-optional-test
          npm install --offline --ignore-scripts --no-optional ./*.tgz
          output=$(MSSQL_MCP_NO_DOWNLOAD=1 ./node_modules/.bin/mssql-mcp --version 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "github.com/codegiveness/mssql-mcp/releases/download/"
          echo "$output" | grep -q "dotnet tool install -g codegiveness.mssql-mcp"
          echo "Error message contract verified."

      - name: Assess package redistribution
        id: redistribution
        run: |
          if dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- check-redistribution; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.redistribution.outputs.allowed == 'true'
        with:
          name: npm-packs
          path: npm/*.tgz

  docker:
    runs-on: ubuntu-latest
    needs: build
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked repository tooling
        run: dotnet restore tools/MssqlMcp.RepoTool --locked-mode
      - name: Build Docker image
        run: docker build -t mssql-mcp-test .
      - name: Install content-pinned Trivy
        run: dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- install-security-tools trivy
      - name: Assess the built container and block HIGH/CRITICAL vulnerabilities
        run: dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- security-scan image mssql-mcp-test --reports artifacts/security/image
      - name: Preserve container findings and advisory metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-container-security
          path: artifacts/security/image
          if-no-files-found: error
          retention-days: 14
      - name: Verify --version exits 0
        run: docker run --rm mssql-mcp-test --version
      - name: Verify live SQL connection inside the container
        run: docker run --rm --network host --env MSSQL_CONNECTION_STRING mssql-mcp-test --validate
        env:
          MSSQL_CONNECTION_STRING: "Server=localhost;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"
