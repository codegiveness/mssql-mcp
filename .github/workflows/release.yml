name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '0.x release tag (e.g. v0.5.5). Major versions >= 1 are blocked.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Both tag pushes and manual dispatch must pass before sync/build/publish.
      - name: Enforce 0.x release policy and resolve version
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/check-release-policy.js --manifest
          node scripts/check-release-policy.js --github-event

      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@12.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Sync ALL version stamps to the tag BEFORE any build step.
      # The native binary embeds <VersionPrefix> at compile time — if the sync
      # runs after `dotnet publish`, the shipped binary reports the stale version
      # (issue: 0.5.3 npm package shipped a binary reporting 0.5.2.0).
      # sync-all-stamps.js writes csproj, main/platform npm packages, and
      # server.json from the manifest before any artifact is built.
      - name: Sync NuGet version
        run: |
          version="${{ steps.tag.outputs.version }}"
          sed -i "s|<VersionPrefix>[^<]*</VersionPrefix>|<VersionPrefix>${version}</VersionPrefix>|" src/mssql-mcp/mssql-mcp.csproj
          echo "Synced VersionPrefix to ${version}"
          grep VersionPrefix src/mssql-mcp/mssql-mcp.csproj

      - name: Sync all version stamps
        run: node scripts/sync-all-stamps.js

      # CI gate: build + test before producing any artifacts.
      - run: dotnet restore mssql-mcp.sln --locked-mode
      - run: dotnet build mssql-mcp.sln --no-restore
      - run: dotnet test --solution mssql-mcp.sln --no-build -- --filter-not-trait Category=Integration

      # Self-contained single-file builds for Unix RIDs (managed SNI, MIT-clean per ADR-0002).
      - name: Build linux-x64
        run: |
          dotnet restore src/mssql-mcp/mssql-mcp.csproj -r linux-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishTrimmed=true --lock-file-path packages.linux-x64.lock.json --locked-mode
          dotnet publish src/mssql-mcp -c Release -r linux-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=true -o artifacts/linux-x64
      - name: Build linux-arm64
        run: |
          dotnet restore src/mssql-mcp/mssql-mcp.csproj -r linux-arm64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishTrimmed=true --lock-file-path packages.linux-arm64.lock.json --locked-mode
          dotnet publish src/mssql-mcp -c Release -r linux-arm64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=true -o artifacts/linux-arm64
      - name: Build osx-x64
        run: |
          dotnet restore src/mssql-mcp/mssql-mcp.csproj -r osx-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishTrimmed=true --lock-file-path packages.osx-x64.lock.json --locked-mode
          dotnet publish src/mssql-mcp -c Release -r osx-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=true -o artifacts/osx-x64
      - name: Build osx-arm64
        run: |
          dotnet restore src/mssql-mcp/mssql-mcp.csproj -r osx-arm64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishTrimmed=true --lock-file-path packages.osx-arm64.lock.json --locked-mode
          dotnet publish src/mssql-mcp -c Release -r osx-arm64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=true -o artifacts/osx-arm64
      # Framework-dependent for Windows (SNI license blocks self-contained per ADR-0002).
      - name: Build win-x64 (framework-dependent)
        run: |
          dotnet restore src/mssql-mcp/mssql-mcp.csproj -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -p:PublishTrimmed=false --lock-file-path packages.win-x64.lock.json --locked-mode
          dotnet publish src/mssql-mcp -c Release -r win-x64 --self-contained false --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/win-x64

      # Flat archives: binary at archive root (ADR-0002).
      - name: Archive Unix RIDs
        run: |
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            (cd artifacts/$rid && tar -czf ../mssql-mcp-${{ steps.tag.outputs.name }}-$rid.tar.gz *)
          done
      - name: Archive Windows RID
        run: cd artifacts/win-x64 && zip -r ../mssql-mcp-${{ steps.tag.outputs.name }}-win-x64.zip *

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          for f in mssql-mcp-*.tar.gz mssql-mcp-*.zip; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Generate SBOM
        run: |
          dotnet tool restore
          dotnet dotnet-CycloneDX mssql-mcp.sln --output-format json --output artifacts/sbom

      # GitHub Release FIRST so the shim self-heal can fetch archives before npm publish lands.
      # Conventional Commits auto-notes (titles enforced by semantic.yml from #16).
      - name: Create GitHub Release
        run: gh release create ${{ steps.tag.outputs.name }} --generate-notes --title ${{ steps.tag.outputs.name }} artifacts/mssql-mcp-*.tar.gz artifacts/mssql-mcp-*.zip artifacts/mssql-mcp-*.sha256 artifacts/sbom/*.json || gh release upload ${{ steps.tag.outputs.name }} artifacts/mssql-mcp-*.tar.gz artifacts/mssql-mcp-*.zip artifacts/mssql-mcp-*.sha256 artifacts/sbom/*.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Attest GitHub Release archives + checksums BEFORE registry pushes so attestation
      # failure aborts the release. NOT the .nupkg — NuGet.org re-signs packages on
      # ingestion, breaking the SHA (NuGetGallery#10026, see ADR-0019).
      - name: Attest GitHub Release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/mssql-mcp-*.tar.gz
            artifacts/mssql-mcp-*.zip
            artifacts/mssql-mcp-*.sha256
            artifacts/sbom/*.json

      # NuGet pack + Trusted Publishing push (OIDC, no long-lived API key; see ADR-0019).
      - name: Pack NuGet
        run: |
          # RID restores overwrite assets; restore the portable tool profile again.
          dotnet restore src/mssql-mcp/mssql-mcp.csproj --locked-mode
          dotnet pack src/mssql-mcp -c Release --no-restore -o artifacts
      - name: NuGet Trusted Publishing login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Push NuGet
        run: dotnet nuget push "artifacts/codegiveness.mssql-mcp.*.nupkg" --skip-duplicate --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      # Sync npm version to the tag, then publish all 6 packages sequentially
      # (5 per-platform first, main last) with provenance (ADR-0028 §7).
      # Fail-fast: if any per-platform publish fails, the main package is not published.
      - name: Sync npm version
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('npm/package.json')); p.version='${{ steps.tag.outputs.version }}'; fs.writeFileSync('npm/package.json', JSON.stringify(p,null,2)+'\n')"

      - name: Publish per-platform npm packages
        run: |
          set -e
          tag="${{ steps.tag.outputs.name }}"
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64; do
            echo "=== Publishing @codegiveness/mssql-mcp-$rid ==="
            pkg_dir="npm/platforms/$rid"
            # Extract the archive into the package dir (binary at root).
            ext="tar.gz"
            [ "$rid" = "win-x64" ] && ext="zip"
            archive="artifacts/mssql-mcp-${tag}-${rid}.${ext}"
            if [ "$ext" = "zip" ]; then
              unzip -o "$archive" -d "$pkg_dir"
            else
              tar -xzf "$archive" -C "$pkg_dir"
            fi
            # Publish from the per-platform package dir.
            (cd "$pkg_dir" && npm publish --provenance --access public)
          done

      - name: Publish main npm package (@codegiveness/mssql-mcp)
        run: cd npm && npm publish --provenance --access public

  smoke:
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained binary (linux-x64)
        run: |
          dotnet restore src/mssql-mcp/mssql-mcp.csproj -r linux-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishTrimmed=true --lock-file-path packages.linux-x64.lock.json --locked-mode
          dotnet publish src/mssql-mcp -c Release -r linux-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=true -o smoke

      - name: Verify --version exits 0
        run: ./smoke/mssql-mcp --version

      - name: Verify --help exits 0 and prints usage
        run: |
          output=$(./smoke/mssql-mcp --help)
          echo "$output" | grep -q "Usage: mssql-mcp"
          echo "$output" | grep -q "To update"

      - name: Verify unknown argument exits 1
        run: |
          set +e
          output=$(./smoke/mssql-mcp upgrade 2>&1 1>/dev/null)
          exit_code=$?
          set -e
          echo "$output" | grep -q "unknown argument 'upgrade'"
          [ "$exit_code" -eq 1 ] || { echo "Expected exit 1, got $exit_code"; exit 1; }

      - name: Start Azure SQL Edge
        run: |
          docker run -d \
            -e "ACCEPT_EULA=1" \
            -e "MSSQL_SA_PASSWORD=YourStrong!Passw0rd" \
            -p 1433:1433 --name mssql-edge \
            mcr.microsoft.com/azure-sql-edge:latest

      - name: Wait for SQL Server to be ready
        run: |
          for i in $(seq 1 60); do
            if docker exec mssql-edge bash -c 'echo > /dev/tcp/localhost/1433' 2>/dev/null; then
              echo "SQL Server port is open"
              # Give it a moment to finish recovery
              sleep 3
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/60)"
            sleep 2
          done
          echo "SQL Server did not start in time"
          docker logs mssql-edge
          exit 1

      - name: Verify --validate exits 0
        run: ./smoke/mssql-mcp --validate
        env:
          MSSQL_CONNECTION_STRING: "Server=localhost;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

      - name: Verify MCP tool responds (JSON-RPC smoke)
        run: |
          # Send initialize + list_databases tools/call over stdio.
          # Messages are sent with small delays between them so the server has time
          # to process each request and flush its response before receiving the next.
          # A trailing sleep keeps stdin open so EOF doesn't trigger early shutdown.
          # Fail if the response contains the crash envelope or is not valid JSON.
          response=$({
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0.0.0"}}}'
            sleep 2
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            sleep 1
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_databases","arguments":{}}}'
            sleep 10
          } | MSSQL_CONNECTION_STRING="Server=localhost;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;" ./smoke/mssql-mcp 2>/dev/null)

          # Check for crash envelope (issue #44 symptom).
          if echo "$response" | grep -q "An error occurred invoking"; then
            echo "FAIL: crash envelope detected — trimming broke serialization again"
            echo "$response"
            exit 1
          fi

          # Check that the tools/call response (id:2) exists and has a result.
          # The initialize response (id:1) also has a result, so we specifically
          # look for the id:2 line and verify it contains a result field.
          if ! echo "$response" | grep '"id":2' | grep -q '"result"'; then
            echo "FAIL: no JSON-RPC result in tools/call response (id:2)"
            echo "$response"
            exit 1
          fi

          echo "PASS: list_databases returned valid JSON-RPC response"
