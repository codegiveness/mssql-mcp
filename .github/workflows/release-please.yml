name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked repository tooling
        run: dotnet restore tools/MssqlMcp.RepoTool --locked-mode

      # A forced major Release-As PR must not create a release after merge.
      - name: Enforce 0.x manifest policy
        run: dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- check-release-policy --manifest

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Trigger release.yml on new tag
        if: steps.release-please.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release-please.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- check-release-policy "$tag"
          echo "Release created with tag $tag, triggering release.yml"
          gh workflow run release.yml -f tag="$tag"
