name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release-please
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # After release-please creates the release PR, sync server.json's
      # non-standard 3 version fields from the manifest (ADR-0034).
      # release-please handles csproj <VersionPrefix> and npm package.json
      # natively via extra-files; server.json needs the sync script.
      - name: Sync server.json version fields
        if: steps.release-please.outputs.release-pr == 'true'
        run: node scripts/sync-server-json.js
