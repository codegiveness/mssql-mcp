name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 4 * * 3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sharpfuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked repository tooling
        run: dotnet restore tools/MssqlMcp.RepoTool --locked-mode
      - name: Restore retained main-branch corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/retained-corpus
          key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('fuzz/mssql-mcp.Fuzz/packages.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ hashFiles('fuzz/mssql-mcp.Fuzz/packages.lock.json') }}-
      - name: Install native libFuzzer compiler and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev
      - name: Instrument parser and Guard, prove crash detection, and fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: dotnet run --project tools/MssqlMcp.RepoTool --no-restore -- run-fuzz "$RUNNER_TEMP/fuzz-results" "$FUZZ_SECONDS" "$RUNNER_TEMP/retained-corpus"
      - name: Stage corpus for future main-branch campaigns
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/retained-corpus"
          cp "$RUNNER_TEMP/fuzz-results/corpus/"* "$RUNNER_TEMP/retained-corpus/"
      - name: Retain corpus without allowing PR writes
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/retained-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: Preserve coverage logs, corpus, and crash/timeout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharpfuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fuzz-results/*.log
            ${{ runner.temp }}/fuzz-results/corpus/
            ${{ runner.temp }}/fuzz-results/probe/
            ${{ runner.temp }}/fuzz-results/findings/
          if-no-files-found: warn
          retention-days: 90
